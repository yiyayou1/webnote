<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebNote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #c8592a; --paper: #faf8f4; --ink: #2c2416; --ink2: #7a6e5f; --border: #e4ddd3; }
    body {
      min-height: 100vh; background: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-family: 'PingFang SC', -apple-system, sans-serif;
      color: var(--ink); padding: 24px;
    }
    .card {
      text-align: center; max-width: 480px; width: 100%;
    }
    .logo {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-bottom: 24px;
    }
    .logo-mark {
      width: 48px; height: 48px; background: var(--accent); color: #fff;
      font-size: 24px; font-weight: 700; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: Georgia, serif;
    }
    .logo-text {
      font-size: 28px; font-weight: 700; color: var(--ink);
      font-family: Georgia, serif;
    }
    .tagline {
      font-size: 16px; color: var(--ink2); line-height: 1.7;
      margin-bottom: 32px;
    }
    .features {
      display: flex; flex-direction: column; gap: 12px;
      text-align: left; margin-bottom: 32px;
    }
    .feature {
      background: #fff; border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 18px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .feature-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .feature-text h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .feature-text p { font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
    .cta {
      display: inline-block; padding: 12px 28px;
      background: var(--accent); color: #fff;
      border-radius: 10px; text-decoration: none;
      font-size: 15px; font-weight: 600;
      transition: background 0.15s;
    }
    .cta:hover { background: #b04a20; }
    .footer {
      margin-top: 24px; font-size: 12px; color: var(--ink2);
    }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">W</div>
      <span class="logo-text">WebNote</span>
    </div>

    <p class="tagline">
      像读纸质书一样读电子书<br>
      在任意网页上划线、高亮、批注、记笔记
    </p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">🖊</div>
        <div class="feature-text">
          <h4>全网页划线高亮</h4>
          <p>支持4种颜色高亮、下划线、波浪线、删除线，刷新页面高亮依然保留</p>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon">📝</div>
        <div class="feature-text">
          <h4>行内批注</h4>
          <p>批注直接显示在高亮文字旁边，支持文字和手绘图，像在书页上写眉批</p>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon">📚</div>
        <div class="feature-text">
          <h4>书架式管理</h4>
          <p>按网站自动分组，像管理书架一样管理你的阅读记录</p>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon">☁️</div>
        <div class="feature-text">
          <h4>数据完全属于你</h4>
          <p>使用你自己的 Supabase 项目存储数据，不经过任何第三方服务器</p>
        </div>
      </div>
    </div>

    <a class="cta" href="https://chrome.google.com/webstore" target="_blank">
      安装 Chrome 插件
    </a>

    <p class="footer">
      数据主权归用户所有 ·
      <a href="reset.html">重置密码</a>
    </p>
  </div>
<script>
// 处理 Supabase 验证跳转（注册确认邮件会跳回这里）
window.addEventListener('load', () => {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const type = params.get('type');
  const accessToken = params.get('access_token');
  const errorCode = params.get('error_code');
  const errorDesc = params.get('error_description');

  if (errorCode) {
    showMsg('error', decodeURIComponent(errorDesc?.replace(/\+/g,' ') || '验证失败，链接可能已过期'));
    return;
  }

  if (type === 'signup' && accessToken) {
    showMsg('success', '✅ 邮箱验证成功！请关闭此页面，回到 WebNote 插件登录。');
    return;
  }

  if (type === 'recovery' && accessToken) {
    // 重置密码跳转到 reset.html
    window.location.href = '/webnote/reset.html' + window.location.hash;
    return;
  }
});

function showMsg(type, text) {
  const div = document.createElement('div');
  div.style.cssText = `
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(250,248,244,0.97);
    display:flex; align-items:center; justify-content:center;
    font-family:'PingFang SC',-apple-system,sans-serif;
    z-index:9999;
  `;
  const card = document.createElement('div');
  card.style.cssText = `
    background:#fff; border-radius:16px; padding:40px 36px;
    max-width:420px; text-align:center;
    box-shadow:0 4px 24px rgba(44,36,22,0.09);
    border:1px solid #e4ddd3;
  `;
  const logo = document.createElement('div');
  logo.style.cssText = 'display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px';
  logo.innerHTML = '<div style="width:36px;height:36px;background:#c8592a;color:#fff;font-size:18px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif">W</div><span style="font-size:22px;font-weight:700;font-family:Georgia,serif">WebNote</span>';
  const msg = document.createElement('p');
  msg.style.cssText = `font-size:15px;line-height:1.7;color:${type==='success'?'#16a34a':'#dc2626'}`;
  msg.textContent = text;
  card.appendChild(logo);
  card.appendChild(msg);
  div.appendChild(card);
  document.body.appendChild(div);
}
</script>
</body>
</html>
